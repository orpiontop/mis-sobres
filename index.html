<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis sobres</title>
<meta name="theme-color" content="#0f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis sobres">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@font-face{font-family:"Sora";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/sora-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Sora";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/sora-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Sora";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/sora-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2")}
/* Layout: phone-first single column with a fixed two-button action bar; from 900px, sobres left and movimientos right. */
:root{
  --bg:#f1f4f1; --surface:#ffffff; --ink:#14201c; --muted:#5d6b66; --line:#dbe2dd;
  --accent:#0f6b4f; --accent-ink:#ffffff; --track:#e4eae6;
  --good:#1b7f5a; --warn:#b26a00; --bad:#b3261e;
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1614; --surface:#18221f; --ink:#e9f0ec; --muted:#93a39d; --line:#2a3833;
    --accent:#3fbf93; --accent-ink:#06261b; --track:#24312d;
    --good:#4fc79b; --warn:#e5a84a; --bad:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1614; --surface:#18221f; --ink:#e9f0ec; --muted:#93a39d; --line:#2a3833;
  --accent:#3fbf93; --accent-ink:#06261b; --track:#24312d;
  --good:#4fc79b; --warn:#e5a84a; --bad:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:96px}
.wrap{max-width:1080px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.top{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px}
.top .lbl{font-size:14px;opacity:.85}
.top .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05}
.top .sub{font-size:14px;opacity:.9;display:flex;gap:12px;flex-wrap:wrap}
.cols{display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font-weight:600}
.amt{font-family:var(--display);font-weight:600;font-size:22px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.bar.low i{background:var(--warn)} .bar.over i{background:var(--bad)}
.meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.pill.low{color:var(--warn)} .pill.over{color:var(--bad)}
.neg{color:var(--bad)} .pos{color:var(--good)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.movs{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mov{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.mov:first-child{border-top:0}
.mov .what{flex:1;min-width:0}
.mov .what b{display:block;font-weight:600;overflow-wrap:anywhere}
.mov .what span{font-size:13px;color:var(--muted)}
.mov .q{font-family:var(--display);font-weight:600;white-space:nowrap}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
select,input[type=text],input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px}
.dock div{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr;gap:10px}
.dock button{border:0;border-radius:14px;padding:16px;font-family:var(--display);font-weight:600;font-size:17px;cursor:pointer}
#bGasto{background:var(--ink);color:var(--bg)}
#bIngreso{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.veil.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.sheet h1{font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:13px;color:var(--muted)}
#fImporte{font-family:var(--display);font-size:36px;font-weight:700;padding:10px 12px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0}
.chips span{display:block;border:1px solid var(--line);border-radius:99px;padding:8px 14px}
.chips input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chips input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.acts{display:flex;gap:10px}
.acts .btn{flex:1;padding:14px}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.srow{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:center}
.srow input{width:100%}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;display:none;z-index:20}
.toast.on{display:block}
.filters{display:flex;gap:8px;flex-wrap:wrap}
@media (min-width:900px){
  .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
  .veil{align-items:center}.sheet{border-radius:18px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<div class="wrap">
  <section class="top" aria-live="polite">
    <span class="lbl">Te queda para gastar este mes</span>
    <span class="big num" id="tTotal">—</span>
    <span class="sub"><span id="tCobro"></span><span id="tAhorro"></span></span>
  </section>
  <div id="status" class="note"></div>
  <div class="cols">
    <div class="sec" style="gap:16px">
      <div class="sec">
        <div class="sechead"><h2>Para gastar · BBVA</h2><button class="btn small" id="bAjustes" type="button">Ajustar sobres</button></div>
        <div id="lGasto" class="sec"></div>
      </div>
      <div class="sec">
        <div class="sechead"><h2>Ahorro · imagin</h2></div>
        <div id="lAhorro" class="grid2"></div>
      </div>
    </div>
    <div class="sec">
      <div class="sechead"><h2>Movimientos</h2>
        <div class="filters">
          <select id="fCiclo" aria-label="Mes"></select>
          <select id="fSobre" aria-label="Sobre"></select>
        </div>
      </div>
      <div class="meta" id="resumen"></div>
      <div class="movs" id="lMovs"></div>
    </div>
  </div>
</div>

<div class="dock"><div>
  <button id="bGasto" type="button">− Apuntar gasto</button>
  <button id="bIngreso" type="button">+ Dinero</button>
</div></div>

<div class="veil" id="vMov"><form class="sheet" id="formMov" autocomplete="off">
  <h1 id="movTitulo">Apuntar gasto</h1>
  <div class="field"><label for="fImporte">Importe (€)</label>
    <input id="fImporte" type="text" inputmode="decimal" placeholder="0,00"></div>
  <div class="field"><span class="lab" id="movSobreLab">¿De qué sobre?</span><div class="chips" id="fChips"></div></div>
  <div class="field"><label for="fNota">Nota (opcional)</label><input id="fNota" type="text" maxlength="80"></div>
  <div class="field"><label for="fFecha">Fecha</label><input id="fFecha" type="date"></div>
  <div class="err" id="movErr" role="alert"></div>
  <div class="acts"><button class="btn" type="button" id="movCancel">Cancelar</button><button class="btn primary" type="submit" id="movOk">Guardar</button></div>
</form></div>

<div class="veil" id="vAj"><form class="sheet" id="formAj" autocomplete="off">
  <h1>Ajustar sobres</h1>
  <p class="note" style="margin:0">Cambia el nombre o los euros al mes. El cambio vale desde este mes; los meses pasados no se tocan.</p>
  <div class="field"><label for="aCobro">Lo que cobro al mes (€)</label><input id="aCobro" type="text" inputmode="decimal"></div>
  <div class="field"><label for="aUrl">Dirección de tu hoja de Google (para guardar en Drive)</label><input id="aUrl" type="text" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" spellcheck="false">
    <span class="note" id="aUrlEstado"></span></div>
  <div id="aLista" class="sec"></div>
  <div class="meta"><span id="aSuma"></span></div>
  <div class="field"><span class="lab">Añadir sobre nuevo</span>
    <div class="srow"><input id="nNombre" type="text" placeholder="Nombre" maxlength="30" aria-label="Nombre del sobre nuevo"><input id="nMensual" type="text" inputmode="decimal" placeholder="€/mes" aria-label="Euros al mes del sobre nuevo"></div>
    <select id="nTipo" aria-label="Tipo del sobre nuevo"><option value="gasto">Para gastar</option><option value="ahorro">Ahorro</option></select>
  </div>
  <div class="err" id="ajErr" role="alert"></div>
  <div class="acts"><button class="btn" type="button" id="ajCancel">Cancelar</button><button class="btn primary" type="submit" id="ajOk">Guardar</button></div>
</form></div>

<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
